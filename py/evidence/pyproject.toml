[project]
name = "khetru-evidence"
version = "0.1.0"
description = "Mandi wheat claim ledger: archive, claims, scoring and verify"
authors = [
    { name = "Yashodhan Singh", email = "dsfx3d@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cdsapi>=0.7.7",
    "eccodes>=2.49.0",
    # The ecCodes C library; eccodes' wheel metadata omits it on Linux/macOS.
    "eccodeslib>=2.49.0.30 ; sys_platform != 'win32'",
    "ecmwf-opendata>=0.3.34",
    "numpy>=2.5.3",
]

[project.optional-dependencies]
# Band map build (`evidence bands build`): reads the DEM tiles and rasterises the polygon.
geo = ["rasterio>=1.4"]
# IMD downloads (`evidence observe fetch-final`, `fetch-realtime`).
obs = ["imdlib>=0.3.1"]

[project.scripts]
evidence = "khetru_evidence.cli:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
